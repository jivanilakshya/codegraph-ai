services:
  # FastAPI development server with source-mounted hot reload.
  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log --log-level warning
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/codegraph_ai
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      UPLOAD_PATH: ${UPLOAD_PATH:-/uploads}
      REPOSITORY_PATH: ${REPOSITORY_PATH:-/repositories}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/uploads
      - ./repositories:/repositories
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - codegraph-network

  # Next.js development server with source-mounted hot reload.
  frontend:
    build:
      context: ./frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - codegraph-network

  # PostgreSQL stores relational application data.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: codegraph_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codegraph-network

  # Neo4j stores code relationships as a graph database.
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - codegraph-network

  # Ollama provides the local language-model runtime.
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - codegraph-network

volumes:
  frontend_node_modules:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  ollama_models:

networks:
  codegraph-network:
    driver: bridge
